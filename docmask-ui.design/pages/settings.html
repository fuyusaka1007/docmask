<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置与帮助</title>
    <style id="theme-vars">
/* DocMask UI — Design Tokens */
:root {
  /* Brand */
  --brand-primary: #168AAD;
  --brand-primary-hover: #11728F;
  --brand-primary-foreground: #FFFFFF;

  /* Surface */
  --brand-background: #F4F7FA;
  --brand-foreground: #172033;
  --brand-muted: #667085;
  --brand-muted-foreground: #9CA3AF;
  --brand-card: #FFFFFF;
  --brand-card-foreground: #172033;
  --brand-popover: #FFFFFF;
  --brand-popover-foreground: #172033;
  --brand-border: #DCE3EA;
  --brand-input: #DCE3EA;
  --brand-ring: #168AAD;

  /* Sidebar */
  --brand-sidebar-bg: #0F1B2D;
  --brand-sidebar-fg: #DCE3EA;
  --brand-sidebar-active-bg: rgba(22, 138, 173, 0.15);
  --brand-sidebar-active-fg: #168AAD;

  /* States */
  --brand-state-success: #168A5B;
  --brand-state-warning: #D68B16;
  --brand-state-error: #D94A4A;
  --brand-state-info: #3B82C4;

  /* Radius */
  --brand-radius-sm: 4px;
  --brand-radius-md: 8px;
  --brand-radius-lg: 12px;
  --brand-radius-pill: 999px;

  /* Shadows */
  --brand-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 1px rgba(15, 23, 42, 0.03);
  --brand-shadow-2: 0 8px 24px -8px rgba(15, 23, 42, 0.18);
  --brand-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.30);

  /* Spacing */
  --brand-s-1: 4px;
  --brand-s-2: 8px;
  --brand-s-3: 12px;
  --brand-s-4: 16px;
  --brand-s-5: 24px;
  --brand-s-6: 32px;
  --brand-s-7: 48px;
  --brand-s-8: 80px;

  /* Typography */
  --brand-font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --brand-font-mono: "Cascadia Code", "Fira Code", "Consolas", monospace;
}

/* Secondary / Accent aliases — map to primary for free-explore compliance */
:root {
  --brand-secondary: var(--brand-background);
  --brand-secondary-foreground: var(--brand-foreground);
  --brand-accent: var(--brand-primary);
  --brand-accent-foreground: var(--brand-primary-foreground);
  --brand-destructive: var(--brand-state-error);
  --brand-destructive-foreground: #FFFFFF;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--brand-background);
    --color-foreground: var(--brand-foreground);
    --color-card: var(--brand-card);
    --color-card-foreground: var(--brand-card-foreground);
    --color-popover: var(--brand-popover);
    --color-popover-foreground: var(--brand-popover-foreground);
    --color-primary: var(--brand-primary);
    --color-primary-foreground: var(--brand-primary-foreground);
    --color-secondary: var(--brand-secondary);
    --color-secondary-foreground: var(--brand-secondary-foreground);
    --color-muted: var(--brand-muted);
    --color-muted-foreground: var(--brand-muted-foreground);
    --color-accent: var(--brand-accent);
    --color-accent-foreground: var(--brand-accent-foreground);
    --color-destructive: var(--brand-destructive);
    --color-destructive-foreground: var(--brand-destructive-foreground);
    --color-border: var(--brand-border);
    --color-input: var(--brand-input);
    --color-ring: var(--brand-ring);
    --radius-sm: var(--brand-radius-sm);
    --radius-md: var(--brand-radius-md);
    --radius-lg: var(--brand-radius-lg);
  }
  @layer base {
    body { background: var(--brand-background); color: var(--brand-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .text-accent-foreground { color: var(--brand-accent-foreground); }
      .border-accent-foreground { border-color: var(--brand-accent-foreground); }
      .ring-accent-foreground { --tw-ring-color: var(--brand-accent-foreground); }
      .bg-destructive { background-color: var(--brand-destructive); }
      .text-destructive { color: var(--brand-destructive); }
      .border-destructive { border-color: var(--brand-destructive); }
      .ring-destructive { --tw-ring-color: var(--brand-destructive); }
      .bg-destructive-foreground { background-color: var(--brand-destructive-foreground); }
      .text-destructive-foreground { color: var(--brand-destructive-foreground); }
      .border-destructive-foreground { border-color: var(--brand-destructive-foreground); }
      .ring-destructive-foreground { --tw-ring-color: var(--brand-destructive-foreground); }
      .bg-border { background-color: var(--brand-border); }
      .text-border { color: var(--brand-border); }
      .border-border { border-color: var(--brand-border); }
      .ring-border { --tw-ring-color: var(--brand-border); }
      .bg-input { background-color: var(--brand-input); }
      .text-input { color: var(--brand-input); }
      .border-input { border-color: var(--brand-input); }
      .ring-input { --tw-ring-color: var(--brand-input); }

    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
    <style id="critical-layout">
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      #app-shell { display: flex; height: 100vh; width: 100%; }
      #app-main { flex: 1; overflow-y: auto; min-width: 0; }
      .settings-row { display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 0; }
      .settings-row + .settings-row { border-top: 1px solid var(--brand-border); }
      .settings-label { font-size: 14px; color: var(--brand-foreground); }
      .settings-dropdown { height: 36px; padding: 0 12px; border: 1px solid var(--brand-border); border-radius: var(--brand-radius-md); background: var(--brand-card); color: var(--brand-foreground); font-size: 14px; cursor: pointer; min-width: 140px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .settings-dropdown:focus { outline: none; border-color: var(--brand-primary); box-shadow: 0 0 0 2px rgba(22,138,173,0.15); }
      .btn-primary { height: 42px; padding: 0 20px; background: var(--brand-primary); color: var(--brand-primary-foreground); border: none; border-radius: var(--brand-radius-md); font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s; }
      .btn-primary:hover { background: var(--brand-primary-hover); }
      .btn-secondary { height: 36px; padding: 0 16px; background: var(--brand-card); color: var(--brand-foreground); border: 1px solid var(--brand-border); border-radius: var(--brand-radius-md); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
      .btn-secondary:hover { background: var(--brand-background); border-color: var(--brand-muted); }
      .btn-ghost { height: 36px; padding: 0 16px; background: transparent; color: var(--brand-muted); border: 1px solid transparent; border-radius: var(--brand-radius-md); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
      .btn-ghost:hover { background: var(--brand-background); color: var(--brand-foreground); }
      .card { background: var(--brand-card); border-radius: var(--brand-radius-lg); box-shadow: var(--brand-shadow-1); padding: 20px 24px; }
      .card-title { font-size: 15px; font-weight: 600; color: var(--brand-foreground); margin-bottom: 4px; }
      .card-desc { font-size: 13px; color: var(--brand-muted); margin-bottom: 16px; }
      .checkbox-label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--brand-foreground); cursor: pointer; }
      .checkbox-label input[type="checkbox"] { accent-color: var(--brand-primary); width: 16px; height: 16px; margin: 0; cursor: pointer; }
      .radio-label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--brand-foreground); cursor: pointer; }
      .radio-label input[type="radio"] { accent-color: var(--brand-primary); width: 16px; height: 16px; margin: 0; cursor: pointer; }
      .info-text { font-size: 12px; color: var(--brand-muted); line-height: 1.5; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
  <div id="app-shell">
    <aside class="w-[220px] flex-shrink-0 flex flex-col h-full" style="background-color: #0F1B2D;">
      <div class="px-5 pt-6 pb-4">
        <div class="flex items-center gap-2">
          <i data-lucide="shield-check" class="w-6 h-6" style="color: #168AAD;"></i>
          <span class="text-base font-semibold" style="color: #FFFFFF;">DocMask</span>
        </div>
        <p class="text-xs mt-1" style="color: #667085;">本地文档保护</p>
      </div>
      <nav class="flex-1 px-3 space-y-1">
        <a data-dom-id="nav-workbench" href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm transition-colors" style="color: #DCE3EA;">
          <i data-lucide="workflow" class="w-5 h-5"></i> 工作台
        </a>
        <a data-dom-id="nav-codebook" href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm transition-colors" style="color: #DCE3EA;">
          <i data-lucide="book-open" class="w-5 h-5"></i> 密码本
        </a>
        <a data-dom-id="nav-results" href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm transition-colors" style="color: #DCE3EA;">
          <i data-lucide="clipboard-list" class="w-5 h-5"></i> 任务结果
        </a>
        <a data-dom-id="nav-settings" href="#" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-medium transition-colors" style="background-color: rgba(22,138,173,0.15); color: #168AAD; border-left: 3px solid #168AAD;">
          <i data-lucide="settings" class="w-5 h-5"></i> 设置与帮助
        </a>
      </nav>
      <div class="px-5 py-4 border-t" style="border-color: rgba(255,255,255,0.08);">
        <div class="flex items-center gap-2 text-xs" style="color: #667085;">
          <i data-lucide="shield" class="w-3.5 h-3.5"></i> 纯本地运行
        </div>
        <p class="text-xs mt-0.5" style="color: #4B5563;">文件不会上传</p>
        <p class="text-xs mt-1" style="color: #4B5563;">v1.0.0</p>
      </div>
    </aside>

    <main id="app-main" style="background-color: var(--brand-background);">
      <div style="max-width: 720px; margin: 0 auto; padding: 32px 24px;">
        <!-- Page Header -->
        <h1 style="font-size: 22px; font-weight: 700; color: var(--brand-foreground); margin-bottom: 24px;">设置与帮助</h1>

        <!-- Section 1: 外观 -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-title">外观</div>
          <div class="card-desc">调整界面显示偏好</div>
          <div class="settings-row">
            <span class="settings-label">主题</span>
            <button class="settings-dropdown">
              <span>跟随系统</span>
              <i data-lucide="chevron-down" class="w-4 h-4" style="color: var(--brand-muted);"></i>
            </button>
          </div>
          <div class="settings-row">
            <span class="settings-label">界面缩放</span>
            <button class="settings-dropdown">
              <span>100%</span>
              <i data-lucide="chevron-down" class="w-4 h-4" style="color: var(--brand-muted);"></i>
            </button>
          </div>
        </div>

        <!-- Section 2: 处理默认值 -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-title">处理默认值</div>
          <div class="card-desc">设置文档处理的默认行为</div>
          <div class="settings-row">
            <span class="settings-label">默认格式</span>
            <div style="display: flex; gap: 12px;">
              <label class="checkbox-label">
                <input type="checkbox" checked> DOCX
              </label>
              <label class="checkbox-label">
                <input type="checkbox" checked> DOC
              </label>
              <label class="checkbox-label">
                <input type="checkbox" checked> TXT
              </label>
            </div>
          </div>
          <div class="settings-row">
            <span class="settings-label">默认输出位置</span>
            <div style="display: flex; gap: 16px;">
              <label class="radio-label">
                <input type="radio" name="output-location" checked> 原文件目录
              </label>
              <label class="radio-label">
                <input type="radio" name="output-location"> 上次使用目录
              </label>
            </div>
          </div>
          <div class="settings-row">
            <label class="checkbox-label">
              <input type="checkbox" checked>
              <span>脱敏任务默认生成覆盖率报告</span>
            </label>
          </div>
        </div>

        <!-- Section 3: 日志与隐私 -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-title">日志与隐私</div>
          <div class="card-desc">管理日志记录与隐私设置</div>
          <div class="settings-row">
            <span class="settings-label">日志级别</span>
            <button class="settings-dropdown">
              <span>INFO</span>
              <i data-lucide="chevron-down" class="w-4 h-4" style="color: var(--brand-muted);"></i>
            </button>
          </div>
          <div style="padding: 12px 0;">
            <p class="info-text">日志仅记录状态与次数，不记录原文和密码本映射。</p>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px;">
            <button class="btn-secondary">
              <i data-lucide="file-text" class="w-4 h-4"></i> 打开日志文件
            </button>
            <button class="btn-secondary">
              <i data-lucide="folder-open" class="w-4 h-4"></i> 打开日志目录
            </button>
            <button class="btn-ghost" style="color: var(--brand-state-error);">
              <i data-lucide="trash-2" class="w-4 h-4"></i> 清空日志
            </button>
          </div>
        </div>

        <!-- Section 4: 帮助 -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-title">帮助</div>
          <div class="card-desc">使用指南与常见问题</div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;">
            <button class="btn-secondary">
              <i data-lucide="book-open" class="w-4 h-4"></i> 密码本编写指南
            </button>
            <button class="btn-secondary">
              <i data-lucide="help-circle" class="w-4 h-4"></i> 常见问题
            </button>
            <button class="btn-secondary">
              <i data-lucide="file-check" class="w-4 h-4"></i> 支持的文档范围
            </button>
            <button class="btn-secondary">
              <i data-lucide="info" class="w-4 h-4"></i> 关于 DocMask
            </button>
          </div>
          <p class="info-text">DOC 文件依赖 Microsoft Word 或 LibreOffice；复杂文本框可能受限。</p>
        </div>
      </div>
    </main>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
